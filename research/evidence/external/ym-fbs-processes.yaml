  - id: P-YM-SETTLEMENT
    title: Взаиморасчёты, выплаты, закрывающие (отчёт агента)
    wave: W3
    graph_hint: null
    required: false
    charter_note: В INI/charter — новый процесс, согласовать. Не блокер первого заказа e2e.
    ym_specifics:
      - Маркет — агент. Счёт на услуги не выставляет: взаимозачёт из платежей покупателей.
      - Отчёт комиссионера у Маркета называется отчётом агента (исполнение поручения и зачёт взаимных требований).
      - Пакет за месяц (договор размещения): акт услуг, счёт-фактура, сводная статистика, отчёт агента. Первые 7 рабочих дней следующего месяца. Почта / ЭДО / кабинет.
      - Основные услуги удерживаются из платежа по заказу; дополнительные — в начале следующего месяца.
      - Выплата по графику (ежедневно или еженедельно с отсрочкой), не в конце отчётного периода. Поэтому в отчёте агента «подлежит перечислению» не равно «перечислено».
      - Акт сверки в кабинете после 10 числа следующего месяца. API сверки нет.
      - Scope токена finance-and-accounting.
      - Ссылка на файл отчёта из API живёт 60 минут.
    methods:
      - verb: POST
        path: "/v2/reports/closure-documents/generate"
        title: ZIP закрывающих за месяц
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/reports/generateClosureDocumentsReport.md
      - verb: POST

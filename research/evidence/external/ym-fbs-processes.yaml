      - Перенос заказа на следующую отгрузку — не позже чем за 30 минут до отсечки. Позже только отмена.
      - Доверительная приёмка: число мест + ярлыки палет, без пересчёта в СЦ.
      - Опоздание / перенос / КГТ не в ту дату бьют по индексу качества.

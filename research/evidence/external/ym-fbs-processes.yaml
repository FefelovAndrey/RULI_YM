  - id: P-YM-QUALITY
    title: Индекс качества FBS
    wave: W1
    graph_hint: F-ORDERS
    required: true
    integration: monitoring
    ym_specifics:
      - Число 0–100, видно только продавцу. Для FBS считается после 10 заказов за 30 дней.
      - Ниже 40 — через сутки магазин гасится на 7 дней.
      - Держать ≥98: не больше 4% не вовремя отгруженных и не больше 2% отмен по своей вине.
      - Плата за отмену и опоздание зависит от индекса. Новым, пока индекса нет, считают как 98–100.
      - ≥20% опозданий за 7 дней — Маркет может сломать график и отнять скидку за скорость.
    methods:
      - verb: POST
        path: "/v2/businesses/{businessId}/ratings/quality"
        title: Индекс магазинов кабинета
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/ratings/getQualityRatings.md
      - verb: POST
        path: "/v2/campaigns/{campaignId}/ratings/quality/details"
        title: "Заказы, которые качнули индекс"
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/ratings/getQualityRatingDetails.md
    support: https://yandex.ru/support/marketplace/ru/quality/score/fbs
    overlay_on:

    graph_hint: F-RETURNS
    required: false
    charter_note: Претензионная работа сверх клиентского возврата FBS — согласовать отдельно. Клиентский возврат — P-YM-RETURN.
    ym_specifics:
      - Подача претензии к Маркету в Partner API отсутствует. Кабинет, роль владельца кабинета/бизнеса.
      - Одна претензия = один магазин, ≤10 заказов или ≤10 SKU. Рассмотрение до 35 рабочих дней.
      - Спор покупателя по отказу — не претензия, а арбитраж в чате (48 часов, решение окончательное).
      - "FBS — потеря в доставке 3 месяца; брак/недостача/кража при получении возврата часто 48 часов с акта; оспорить возврат денег — 30 дней с выдачи возврата."
      - Расхождение при вывозе: фото в заявку за 48 часов, затем 30 дней на претензию.
      - Компенсация FBS от объявленной ценности, 10–100%. Пересмотр 30 дней.
      - Несогласие с актом услуг — обращение «Взаиморасчёты и документы», не тип претензии из списка.
    methods:
      - verb: POST
        path: notification
        title: События спора и возврата (наш endpoint)
        url: https://yandex.ru/dev/market/partner-api/doc/ru/push-notifications/reference/sendNotification.md
      - verb: POST
        path: "/v2/businesses/{businessId}/chats/new"
        title: Чат с покупателем
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/chats/createChat.md
      - verb: POST
        path: "/v2/businesses/{businessId}/chats"
        title: Список чатов
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/chats/getChats.md
      - verb: POST
        path: "/v2/businesses/{businessId}/chats/history"
        title: История чата (в т.ч. с арбитром)
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/chats/getChatHistory.md
    cabinet_only:
      - "Подать претензию — https://yandex.ru/support/marketplace/ru/communication/claims"
    support:
      - https://yandex.ru/support/marketplace/ru/orders/returns/fbs
      - https://yandex.ru/legal/marketplace_service_agreement/#index__12_41
      - https://yandex.ru/legal/marketplace_service_agreement/#index__12_5
    overlay_on:
      - Кто забирает возвраты и успевает сфотографировать расхождения
      - Кто владелец кабинета для кнопки «Претензия»
      - Как претензии к Ozon уже живут в 1С/поддержке


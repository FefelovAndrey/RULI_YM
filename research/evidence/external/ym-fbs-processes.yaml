        path: "/v2/campaigns/{campaignId}/orders/{orderId}/returns/{returnId}/application"
        title: Заявление покупателя
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/returns/getReturnApplication.md
      - verb: GET
        path: "/v2/campaigns/{campaignId}/orders/{orderId}/returns/{returnId}/decision/{itemId}/image/{imageHash}"
        title: Фото товара
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/returns/getReturnPhoto.md
      - verb: POST
        path: "/v1/businesses/{businessId}/returns/decisions"
        title: Доступные решения
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/returns/getReturnAvailableDecisions.md
      - verb: POST
        path: "/v2/campaigns/{campaignId}/orders/{orderId}/returns/{returnId}/decision/submit"

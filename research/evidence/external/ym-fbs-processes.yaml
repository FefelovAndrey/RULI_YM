  - id: P-YM-RETURN
    title: Невыкупы и возвраты FBS
    wave: W1
    graph_hint: F-RETURNS
    required: true
    ym_specifics:
      - Невыкуп (не забрали / отказались до получения) и возврат после получения — разные истории, один API-контур.
      - По одному заказу бывает несколько возвратов (поштучно).
      - Срок решения в доках расходится: API — 48 часов после заявления; справка FBS — 24 часа с принятия заявки, иначе автоодобрение денег покупателю (оспорить нельзя).
      - После прибытия товара в ПВЗ/СЦ — 48 часов забрать и решить по деньгам.
      - Покупатель может оспорить отказ за 72 часа → арбитраж 48 часов, решение окончательное.
      - Если прозевали срок на заявке — Маркет подтверждает возврат сам.
      - Покупатель может открыть спор (PREMODERATION_DISPUTE) и чат с арбитром.
      - Частичный невыкуп: заказ остаётся DELIVERED, состав смотрится сравнением items заказа и items возврата.
      - Быстрый возврат денег за дешёвый брак — флаг fastReturn, если опция включена.
      - Стоимость заказа в getBusinessOrders не вычитает возвраты — для денег вычитать amount возврата.
    methods:
      - verb: GET
        path: "/v2/campaigns/{campaignId}/returns"
        title: Список невыкупов и возвратов
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/returns/getReturns.md

# Канон процессов Яндекс Маркета (FBS) для наложения на внутренний AS IS.
# Человеческий вид: ym-fbs-battle-map.md
# Не путать с graph.yaml: здесь внешние процессы Маркета, не фичи RULI.

version: "0.1"
updated: "2026-08-25"
source_of_truth: official-public-docs
model_in_scope: FBS
models_out_of_scope: [FBY, DBS, Express, LaaS, MarketYandexGo]
wave_hint: W1-FOUNDATION
charter: ../../context/00-charter.md
docs_index: https://yandex.ru/dev/market/partner-api/doc/ru/llms.txt
api_base: https://api.partner.market.yandex.ru
openapi: https://github.com/yandex-market/yandex-market-partner-api

# Два уровня API. Путать их нельзя.
levels:
  cabinet:
    id_param: businessId
    meaning: Кабинет продавца. Каталог общий на все магазины.
  shop:
    id_param: campaignId
    meaning: Магазин внутри кабинета (кампания). Заказы, отгрузки, цены магазина.
  how_to_get_ids:
    method: GET v2/campaigns
    url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/campaigns/getCampaigns.md

integration_channels:
  - id: partner-api
    primary_for: automation
    note: HTTPS, заголовок Api-Key. OAuth 2.0 помечен устаревшим.
  - id: api-notifications
    primary_for: order-events
    note: Маркет стучится к нам POST notification. Необязательно, но без этого опрос раз в час.
  - id: cabinet-ui
    primary_for: setup-and-exceptions
  - id: excel
    primary_for: catalog-prices-stocks-bootstrap
  - id: yml
    primary_for: stocks-alongside-api
  - id: 1c-module
    url: https://yandex.ru/dev/market/partner-api/doc/ru/modules/1c.md
    note: Официальный модуль Маркета для 1С. Наличие в контуре RULI — вопрос к AS IS.
  - id: cms-modules
    url: https://yandex.ru/support/marketplace/ru/tools/api-modules

cross_cutting:
  auth:
    token: Api-Key
    create: https://yandex.ru/dev/market/partner-api/doc/ru/concepts/api-key.md
    scopes: https://yandex.ru/dev/market/partner-api/doc/ru/concepts/access.md
    max_tokens: 30
    header: "Api-Key: <token>"
  limits:
    url: https://yandex.ru/dev/market/partner-api/doc/ru/concepts/limits.md
    parallel_requests: 4
    max_body_kb: 512
    pagination: pageToken+limit  # page/pageSize устарели
    over_limit_http: 420
  sandbox:
    url: https://yandex.ru/dev/market/partner-api/doc/ru/concepts/sandbox.md
    flag: fake=true
    note: Не портят индекс качества. В списках заказов по умолчанию не видны.
  push:
    url: https://yandex.ru/dev/market/partner-api/doc/ru/push-notifications/index.md
    endpoint_we_expose: POST notification
    https_only: true
    no_self_signed_cert: true
    ping_timeout_sec: 1
    event_timeout_sec: 10
    poll_fallback_fbs: "не реже раза в час"

# Порядок happy path FBS. Исключения — внутри процессов.
happy_path:
  - P-YM-AUTH
  - P-YM-WAREHOUSE
  - P-YM-CATALOG
  - P-YM-CONTENT
  - P-YM-PLACEMENT
  - P-YM-PRICE
  - P-YM-STOCK
  - P-YM-ORDER-IN
  - P-YM-ORDER-PACK
  - P-YM-SHIPMENT
  - P-YM-RETURN

processes:
  - id: P-YM-AUTH
    title: Доступ к API и идентификаторы
    wave: W1
    graph_hint: C-YM-API
    required: true
    ym_specifics:
      - Токен создаёт владелец или менеджер кабинета. До 30 штук, бессрочный, пока не удалят.
      - Доступы режутся по группам методов (карточки, цены, заказы, финансы, чаты).
      - businessId и campaignId достаются одним GET v2/campaigns по токену.
      - OAuth 2.0 в доке помечен как устаревший.
    methods:
      - verb: GET
        path: "/v2/campaigns"
        title: Список магазинов и идентификаторы
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/campaigns/getCampaigns.md
      - verb: GET
        path: "/v2/campaigns/{campaignId}"
        title: Информация о магазине
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/campaigns/getCampaign.md
      - verb: POST
        path: "/v2/businesses/{businessId}/settings"
        title: Настройки кабинета (в т.ч. onlyDefaultPrice)
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/businesses/getBusinessSettings.md
      - verb: GET
        path: "/v2/campaigns/{campaignId}/settings"
        title: Настройки магазина
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/campaigns/getCampaignSettings.md
      - verb: POST
        path: "/v2/auth/token"
        title: Информация о токене и доступах
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/auth/getAuthTokenInfo.md
    overlay_on:
      - Кто хранит токен, кто его ротирует
      - Один кабинет или несколько магазинов/campaignId
      - Есть ли уже мёртвая интеграция, которую нельзя чинить поверх

  - id: P-YM-WAREHOUSE
    title: Склад FBS и график отгрузок
    wave: W1
    graph_hint: C-YM-API
    required: true
    setup_mostly_in: cabinet
    ym_specifics:
      - FBS = товар на нашем складе, доставку дальше делает Маркет. Отгрузка — пачка заказов раз в день, не по одному.
      - Адрес склада должен быть реальным. Точка приёма (СЦ или ПВЗ) выбирается в кабинете.
      - График: «в тот же день» или «на следующий». Выходные сдвигают отгрузку на ближайший рабочий.
      - КГТ (>15 кг или >70 см по стороне) едет не в любую точку.
      - Группы складов меняют метод передачи остатков.
      - Отключение модели склада скрывает товары ~15 минут; если модель выключена 30+ дней — возврат на витрину до 4 часов. Если модель выключил сам Маркет, методом её не включить.
    methods:
      - verb: POST
        path: "/v3/businesses/{businessId}/warehouses"
        title: Список складов (без групп складов)
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/warehouses/getPartnerWarehouses.md
      - verb: POST
        path: "/v2/businesses/{businessId}/warehouses"
        title: Список складов / группы / статусы
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/warehouses/getPagedWarehouses.md
      - verb: POST
        path: "/v3/businesses/{businessId}/warehouse/models/status"
        title: Включить/выключить модель склада
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/warehouses/updateWarehouseModelStatus.md
    support:
      - https://yandex.ru/support/marketplace/ru/start/models/fbs
      - https://yandex.ru/support/marketplace/ru/orders/fbs/logistics.md
      - https://yandex.ru/dev/market/partner-api/doc/ru/step-by-step/warehouses.md
    overlay_on:
      - Адрес и график склада RULI vs кабинет ЯМ
      - Есть ли группы складов в кабинете
      - Кто физически отвозит в СЦ/ПВЗ

  - id: P-YM-PUSH
    title: События заказов (уведомления или опрос)
    wave: W1
    graph_hint: F-ORDERS
    required: recommended
    ym_specifics:
      - Маркет рекомендует API-уведомления. Без них FBS/DBS нужно опрашивать не реже раза в час (Экспресс — каждые 10–15 мин).
      - Наш endpoint только HTTPS с сертификатом УЦ, не самоподписанным. Проверка IP Маркета.
      - PING при подключении: ответ 200 за 1 секунду. Обычные события — 10 секунд.
      - Если молчим, Маркет ретраит и через 14 дней отключает уведомления (магазин при этом продаёт дальше).
      - Тестовые заказы тоже приходят в уведомлениях.
      - Если повесить одно и то же на кабинет и на магазин, уйдёт одно уведомление — на URL магазина.
    methods:
      - verb: POST
        path: "notification"
        title: Входящее уведомление (наш endpoint)
        url: https://yandex.ru/dev/market/partner-api/doc/ru/push-notifications/reference/sendNotification.md
      - verb: POST
        path: "/v1/businesses/{businessId}/orders"
        title: Детали заказа после события
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/orders/getBusinessOrders.md
    event_types:
      - создание / изменение / смена статуса заказа
      - заявка на отмену / отмена
      - невыкуп или возврат / смена статуса возврата
      - чат, спор, отзыв (для W1 не обязательны)
    overlay_on:
      - Push vs poll — кандидат в D-*
      - Есть ли у WA публичный HTTPS endpoint

  - id: P-YM-CATALOG
    title: Каталог и товарные карточки
    wave: W1
    graph_hint: F-CATALOG
    tracker_hint: DEVEL-2601
    required: true
    ym_specifics:
      - Каталог живёт на уровне кабинета. SKU продавца = offerId, уникален в кабинете.
      - Карточку Маркет собирает сам и может перепривязать оффер к другой карточке, даже если передали marketSku.
      - Категория — только листовая (без дочерних). Характеристики разные по категориям и со временем меняются.
      - Штрихкод производителя, иначе генерация штрихкода Маркета.
      - Не все товары можно продавать на Маркете и не все — по FBS. Ограничения в справке.
      - После загрузки товар ещё не на витрине: нужны условия размещения в магазине (P-YM-PLACEMENT).
    methods:
      - verb: POST
        path: "/v2/categories/tree"
        title: Дерево категорий
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/categories/getCategoriesTree.md
      - verb: POST
        path: "/v2/category/{categoryId}/parameters"
        title: Характеристики категории
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/content/getCategoryContentParameters.md
      - verb: POST
        path: "/v2/businesses/{businessId}/offer-mappings/update"
        title: Добавить/изменить товары в каталоге
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/business-offer-mappings/updateOfferMappings.md
      - verb: POST
        path: "/v1/businesses/{businessId}/offer-mappings/barcodes/generate"
        title: Генерация штрихкодов Маркета
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/business-offer-mappings/generateOfferBarcodes.md
      - verb: POST
        path: "/v2/businesses/{businessId}/offer-mappings"
        title: Товары в каталоге и привязка к карточкам
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/business-offer-mappings/getOfferMappings.md
      - verb: POST
        path: "/v2/businesses/{businessId}/offer-mappings/delete"
        title: Удалить из каталога
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/business-offer-mappings/deleteOffers.md
      - verb: POST
        path: "/v2/businesses/{businessId}/offer-mappings/archive"
        title: В архив
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/business-offer-mappings/addOffersToArchive.md
      - verb: POST
        path: "/v2/businesses/{businessId}/offer-mappings/unarchive"
        title: Из архива
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/business-offer-mappings/deleteOffersFromArchive.md
    how_to: https://yandex.ru/dev/market/partner-api/doc/ru/step-by-step/assortment-add-goods.md
    overlay_on:
      - PIM vs WA как источник карточки
      - Маппинг категорий и атрибутов RULI → листовые категории ЯМ
      - Стабильность offerId / SKU

  - id: P-YM-CONTENT
    title: Наполнение карточки (категорийные характеристики)
    wave: W1
    graph_hint: F-CATALOG
    required: true
    ym_specifics:
      - updateOfferMappings передаёт основу; категорийный контент — отдельный контур offer-cards.
      - Всегда полный набор характеристик. Пустое значение затирает то, что уже стояло.
      - Списки параметров категории нужно периодически перечитывать: Маркет их дополняет.
    methods:
      - verb: POST
        path: "/v2/businesses/{businessId}/offer-cards"
        title: Статус заполненности карточек
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/content/getOfferCardsContentStatus.md
      - verb: POST
        path: "/v2/businesses/{businessId}/offer-cards/update"
        title: Записать категорийные характеристики
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/content/updateOfferContent.md
      - verb: POST
        path: "/v2/category/{categoryId}/parameters"
        title: Актуальный список характеристик
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/content/getCategoryContentParameters.md
    how_to: https://yandex.ru/dev/market/partner-api/doc/ru/step-by-step/content-change.md
    overlay_on:
      - Полнота PIM по категориям ЯМ
      - Кто чинит карточки после отказа модерации

  - id: P-YM-PLACEMENT
    title: Условия продажи в магазине (витрина)
    wave: W1
    graph_hint: F-CATALOG
    required: true
    ym_specifics:
      - Каталог кабинета ≠ витрина магазина. На витрину товар попадает после условий размещения.
      - НДС, квант продажи, минимальный объём заказа — здесь. Для DBS ещё доставка (нам не нужно).
      - Скрытие с витрины — отдельный контур hidden-offers, не удаление из каталога.
    methods:
      - verb: POST
        path: "/v2/campaigns/{campaignId}/offers/update"
        title: Условия продажи в магазине
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/offers/updateCampaignOffers.md
      - verb: POST
        path: "/v2/campaigns/{campaignId}/offers"
        title: Товары магазина и статусы на витрине
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/offers/getCampaignOffers.md
      - verb: POST
        path: "/v2/campaigns/{campaignId}/offers/delete"
        title: Убрать из ассортимента магазина
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/offers/deleteCampaignOffers.md
      - verb: GET
        path: "/v2/campaigns/{campaignId}/hidden-offers"
        title: Список скрытых
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/hidden-offers/getHiddenOffers.md
      - verb: POST
        path: "/v2/campaigns/{campaignId}/hidden-offers"
        title: Скрыть с витрины
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/hidden-offers/addHiddenOffers.md
      - verb: POST
        path: "/v2/campaigns/{campaignId}/hidden-offers/delete"
        title: Вернуть на витрину
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/hidden-offers/deleteHiddenOffers.md
      - verb: GET
        path: "/v2/categories/max-sale-quantum"
        title: Лимит кванта (см. док метода)
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/categories/getCategoriesMaxSaleQuantum.md
    statuses_help: https://yandex.ru/support/marketplace/assortment/add/statuses.html
    overlay_on:
      - Как сейчас включают/выключают SKU на других МП
      - НДС в 1С vs то, что ждёт ЯМ

  - id: P-YM-PRICE
    title: Цены и карантин
    wave: W1
    graph_hint: F-PRICE-SYNC
    tracker_hint: DEVEL-2600
    required: true
    ym_specifics:
      - Цена кабинета (все магазины) или цена конкретного магазина. Выбор смотрится в onlyDefaultPrice настроек кабинета.
      - Скидка на витрине — прежняя цена + новая; скидка 5–99%.
      - Карантин: резкое падение относительно своей старой цены (по умолчанию больше чем в 2 раза) или относительно рынка. Пока не подтвердите — по новой цене не продаётся.
      - НДС передаётся не в методе цен, а в условиях продажи (offers/update).
      - Калькулятор тарифов — чтобы цена на витрине не ушла в минус после комиссии.
    methods:
      - verb: POST
        path: "/v2/businesses/{businessId}/offer-prices/updates"
        title: Цены на все магазины
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/prices/updateBusinessPrices.md
      - verb: POST
        path: "/v2/campaigns/{campaignId}/offer-prices/updates"
        title: Цены в одном магазине
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/prices/updatePrices.md
      - verb: POST
        path: "/v2/businesses/{businessId}/offer-prices"
        title: Прочитать цены кабинета
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/prices/getDefaultPrices.md
      - verb: POST
        path: "/v2/campaigns/{campaignId}/offer-prices"
        title: Прочитать цены магазина
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/prices/getPricesByOfferIds.md
      - verb: POST
        path: "/v2/businesses/{businessId}/price-quarantine"
        title: Карантин кабинета
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/price-quarantine/getBusinessQuarantineOffers.md
      - verb: POST
        path: "/v2/businesses/{businessId}/price-quarantine/confirm"
        title: Подтвердить карантин кабинета
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/price-quarantine/confirmBusinessPrices.md
      - verb: POST
        path: "/v2/campaigns/{campaignId}/price-quarantine"
        title: Карантин магазина
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/price-quarantine/getCampaignQuarantineOffers.md
      - verb: POST
        path: "/v2/campaigns/{campaignId}/price-quarantine/confirm"
        title: Подтвердить карантин магазина
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/price-quarantine/confirmCampaignPrices.md
      - verb: POST
        path: "/v2/tariffs/calculate"
        title: Калькулятор услуг Маркета
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/tariffs/calculateTariffs.md
      - verb: POST
        path: "/v2/businesses/{businessId}/offers/recommendations"
        title: Рекомендации по ценам
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/offers/getOfferRecommendations.md
    how_to: https://yandex.ru/dev/market/partner-api/doc/ru/step-by-step/assortment-change-prices.md
    overlay_on:
      - Логика цены для ЯМ (DEVEL-2600)
      - Кто подтверждает карантин
      - Нужны ли акционные цены (P-YM-PROMO — не W1)

  - id: P-YM-STOCK
    title: Остатки
    wave: W1
    graph_hint: F-STOCK-SYNC
    tracker_hint: DEVEL-2599
    required: true
    ym_specifics:
      - Передавать свободно доступное к новым заказам, не «сколько лежит на полке всего».
      - Заказы ЯМ Маркет сам резервирует на витрине. Наш фид должен уже вычитать и продажи на других каналах.
      - Если FBS-заказ отменили после «Готов к отгрузке», Маркет остаток сам не вернёт — нужно распаковать и передать новое число.
      - Обновление на витрине до 15 минут. Минимум раз в день, по смыслу — чаще, иначе отмены и индекс.
      - Два метода: без групп складов — v3 businesses/.../stocks/update; с группами — PUT v2 campaigns/.../offers/stocks (и остаток на один склад группы).
      - API можно мешать с Excel/YML.
    methods:
      - verb: POST
        path: "/v3/businesses/{businessId}/offers/stocks/update"
        title: Передать остатки (нет групп складов)
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/stocks/updateStocksOnPartnerWarehouses.md
      - verb: POST
        path: "/v3/businesses/{businessId}/offers/stocks"
        title: Прочитать остатки (нет групп складов)
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/stocks/getStocksOnPartnerWarehouses.md
      - verb: PUT
        path: "/v2/campaigns/{campaignId}/offers/stocks"
        title: Передать остатки (есть группы складов)
        url: https://yandex.ru/dev/market/partner-api/doc/ru/reference/stocks/updateStocks.md
      - verb: POST
        path: "/v2/campaigns/{campaignId}/offers/stocks"
        title: Остатки и оборачиваемость магазина

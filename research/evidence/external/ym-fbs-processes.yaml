    required: true
    ym_specifics:
      - Одна отгрузка в день. Акт на все заказы сразу, не на каждый.
      - Через API акт и подтверждение отгрузки — после того как ВСЕ заказы в отгрузке READY_TO_SHIP или отменены. Иначе ошибка со списком неготовых.
      - В кабинете «подписать акт» отдельно; через API подтверждение — обязательный шаг, в UI его нет.
